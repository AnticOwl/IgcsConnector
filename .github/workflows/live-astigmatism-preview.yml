name: Apply live astigmatism preview

on:
  push:
    branches:
      - optics-integration-trigger-20260824

jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger live astigmatism preview'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optics-integration-trigger-20260824
          fetch-depth: 0

      - name: Add live astigmatism setup preview
        shell: python
        run: |
          from pathlib import Path

          # Shader: hidden preview state + setup-time astigmatism transform only.
          path = Path('src/Shader/IgcsDof.fx')
          text = path.read_text(encoding='utf-8')

          marker = '\tuniform bool TiltedFocusPlaneEnabled < hidden=true; > = false;\n'
          insert = ('\tuniform bool AstigmatismEnabled < hidden=true; > = false;\n'
                    '\tuniform float AstigmatismStrength < hidden=true; > = 0.0;\n'
                    '\tuniform float AstigmatismRotation < hidden=true; > = 0.0;\n\n')
          if insert not in text:
              if marker not in text:
                  raise SystemExit('Astigmatism uniform insertion marker not found')
              text = text.replace(marker, insert + marker, 1)

          fn_marker = '\tfloat2 applyTiltedFocusPlane(float2 uv, float2 alignment)\n'
          fn = r'''	float2 applyAstigmatismSetupPreview(float2 alignment)
	{
		if(!AstigmatismEnabled || AstigmatismStrength <= 0.0001)
		{
			return alignment;
		}

		const float angle = radians(AstigmatismRotation);
		const float c = cos(angle);
		const float s = sin(angle);
		const float localX = alignment.x * c + alignment.y * s;
		const float localY = -alignment.x * s + alignment.y * c;

		const float axisSplit = 0.5 * AstigmatismStrength;
		const float focusedLocalX = localX * (1.0 + axisSplit);
		const float focusedLocalY = localY * (1.0 - axisSplit);

		return float2(
			focusedLocalX * c - focusedLocalY * s,
			focusedLocalX * s + focusedLocalY * c);
	}

'''
          if 'float2 applyAstigmatismSetupPreview(float2 alignment)' not in text:
              if fn_marker not in text:
                  raise SystemExit('Astigmatism function insertion marker not found')
              text = text.replace(fn_marker, fn + fn_marker, 1)

          old_setup = '\t\t\tfloat2 setupAlignment = applyTiltedFocusPlane(warpedUv, float2(FocusDelta, 0.0));\n'
          new_setup = ('\t\t\tfloat2 setupAlignment = applyAstigmatismSetupPreview(float2(FocusDelta, 0.0));\n'
                       '\t\t\tsetupAlignment = applyTiltedFocusPlane(warpedUv, setupAlignment);\n')
          if old_setup in text:
              text = text.replace(old_setup, new_setup, 1)
          elif new_setup not in text:
              raise SystemExit('Setup alignment marker not found')

          path.write_text(text, encoding='utf-8')

          # Controller: push astigmatism state to hidden shader uniforms.
          path = Path('src/DepthOfFieldController.cpp')
          text = path.read_text(encoding='utf-8')
          marker = '\tsetUniformFloatVariable(runtime, "FocusDelta", _focusDelta);\n'
          insert = ('\tsetUniformBoolVariable(runtime, "AstigmatismEnabled", _astigmatismEnabled);\n'
                    '\tsetUniformFloatVariable(runtime, "AstigmatismStrength", _astigmatismStrength);\n'
                    '\tsetUniformFloatVariable(runtime, "AstigmatismRotation", _astigmatismRotation);\n')
          if insert not in text:
              if marker not in text:
                  raise SystemExit('Controller uniform marker not found')
              text = text.replace(marker, marker + insert, 1)
          path.write_text(text, encoding='utf-8')

          # Addon UI: update shader immediately while editing astigmatism controls.
          path = Path('src/Main.cpp')
          text = path.read_text(encoding='utf-8')
          start_marker = 'ImGui::SeparatorText("Astigmatism");'
          end_marker = 'ImGui::TextUnformatted("Astigmatism preview");'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]

          old = 'saveIniFile();'
          replacement = 'g_depthOfFieldController.writeVariableStateToShader(runtime);\n\t\t\t\t\t\t\t\tsaveIniFile();'
          count = block.count(old)
          if count != 3:
              raise SystemExit(f'Unexpected Astigmatism block: found {count} saveIniFile calls')
          if 'writeVariableStateToShader(runtime);' not in block:
              block = block.replace(old, replacement)
              text = text[:start] + block + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Commit live astigmatism preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Shader/IgcsDof.fx src/DepthOfFieldController.cpp src/Main.cpp
          git commit -m "Preview astigmatism live during setup"
          git push origin HEAD:optics-integration-trigger-20260824
