name: Apply independent vignetting

on:
  push:
    branches:
      - optics-integration-trigger-20260824

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply independent vignetting patch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optics-integration-trigger-20260824
          fetch-depth: 0
      - name: Make vignetting independent from pupil clipping
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/Shader/IgcsDof.fx')
          text = path.read_text(encoding='utf-8')

          old = '''\t\t\t// Preserve validated render-time vignetting math.\n\t\t\tif(VignettingEnabled)\n\t\t\t{\n\t\t\t\tfloat2 lensOffset = (warpedUv - float2(VignettingCenterX, VignettingCenterY)) * 2.0;\n\t\t\t\tlensOffset.y /= BUFFER_WIDTH * BUFFER_RCP_HEIGHT;\n\t\t\t\tlensOffset /= length(float2(rcp(BUFFER_WIDTH * BUFFER_RCP_HEIGHT), 1.0));\n\n\t\t\t\tfloat vignetteRadius = length(lensOffset);\n\t\t\t\tfloat2 radialDirection = vignetteRadius > 1e-6 ? lensOffset / vignetteRadius : float2(0.0, 0.0);\n\t\t\t\tfloat vignetteFalloff = linearstep(VignettingStart, VignettingEnd, vignetteRadius);\n\t\t\t\tfloat pupilShift = vignetteFalloff * VignettingStrength * sqrt(2.0);\n\t\t\t\tfloat2 vignetteSample = apertureSample + radialDirection * pupilShift;\n\t\t\t\tfloat vignetteMask = smoothstep(1.0, 0.98, length(vignetteSample));\n\t\t\t\tresult.rgb *= vignetteMask;\n\t\t\t}\n'''

          new = '''\t\t\t// Independent radial vignetting. This deliberately does not use apertureSample,\n\t\t\t// so Cat Eye / pupil clipping cannot dictate the vignetting shape.\n\t\t\tif(VignettingEnabled)\n\t\t\t{\n\t\t\t\tfloat2 lensOffset = (warpedUv - float2(VignettingCenterX, VignettingCenterY)) * 2.0;\n\t\t\t\tlensOffset.y /= BUFFER_WIDTH * BUFFER_RCP_HEIGHT;\n\t\t\t\tlensOffset /= length(float2(rcp(BUFFER_WIDTH * BUFFER_RCP_HEIGHT), 1.0));\n\n\t\t\t\tfloat vignetteRadius = length(lensOffset);\n\t\t\t\tfloat vignetteFalloff = linearstep(VignettingStart, VignettingEnd, vignetteRadius);\n\t\t\t\tfloat vignetteMask = saturate(1.0 - vignetteFalloff * VignettingStrength);\n\t\t\t\tresult.rgb *= vignetteMask;\n\t\t\t}\n'''

          if old not in text:
              raise SystemExit('Expected vignetting block not found; shader left untouched.')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit shader change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Shader/IgcsDof.fx
          git commit -m "Decouple vignetting from pupil clipping"
          git push origin HEAD:optics-integration-trigger-20260824
