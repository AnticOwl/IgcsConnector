name: Fix astigmatism live uniforms

on:
  push:
    branches:
      - optics-integration-trigger-20260824

jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger astigmatism uniform fix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optics-integration-trigger-20260824
          fetch-depth: 0
      - name: Fix controller uniform placement
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/DepthOfFieldController.cpp')
          t = p.read_text(encoding='utf-8')
          extra = ('\tsetUniformBoolVariable(runtime, "AstigmatismEnabled", _astigmatismEnabled);\n'
                   '\tsetUniformFloatVariable(runtime, "AstigmatismStrength", _astigmatismStrength);\n'
                   '\tsetUniformFloatVariable(runtime, "AstigmatismRotation", _astigmatismRotation);\n')
          # Remove the accidental copy from setXFocusDelta.
          sx = t.index('void DepthOfFieldController::setXFocusDelta')
          ex = t.index('void DepthOfFieldController::displayScreenshotSessionStartError', sx)
          block = t[sx:ex].replace(extra, '', 1)
          t = t[:sx] + block + t[ex:]

          # Add the uniforms inside writeVariableStateToShader, immediately after FocusDelta.
          ws = t.index('void DepthOfFieldController::writeVariableStateToShader')
          marker = '\tsetUniformFloatVariable(runtime, "FocusDelta", _focusDelta);\n'
          pos = t.index(marker, ws) + len(marker)
          if extra not in t[ws:ws+3000]:
              t = t[:pos] + extra + t[pos:]
          p.write_text(t, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DepthOfFieldController.cpp
          git commit -m "Fix live astigmatism uniform updates"
          git push origin HEAD:optics-integration-trigger-20260824
